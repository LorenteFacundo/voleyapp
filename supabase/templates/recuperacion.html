<!doctype html>
<html lang="es">
  <body style="margin:0;background:#f8f9fa;font-family:Arial,Helvetica,sans-serif;color:#2d3436">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:24px 12px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border-radius:16px;padding:28px">
            <tr><td style="font-size:20px;font-weight:800;color:#1a237e;padding-bottom:4px">VoleyApp</td></tr>
            <tr><td style="font-size:18px;font-weight:700;padding:12px 0 8px">Restablecé tu contraseña</td></tr>
            <tr>
              <td style="font-size:15px;line-height:1.5;color:#4a5054;padding-bottom:20px">
                Recibimos un pedido para cambiar la contraseña de <strong>{{ .Email }}</strong>. Tocá el botón y elegí una nueva. El enlace vence en una hora y sirve una sola vez.
              </td>
            </tr>
            <tr>
              <td>
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#c2410c;color:#ffffff;text-decoration:none;font-weight:700;padding:12px 20px;border-radius:12px">Elegir una contraseña nueva</a>
              </td>
            </tr>
            <tr>
              <td style="font-size:12px;color:#6b7280;padding-top:24px">
                Si no lo pediste, ignorá este mensaje: tu contraseña no cambia.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
